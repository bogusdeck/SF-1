# fly.toml app configuration file for LF Online Game Server
# Refer to https://fly.io/docs/reference/configuration/ for information

app = "lf-online-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[services]]
  protocol = "tcp"
  internal_port = 2567

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
